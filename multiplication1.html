<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>구구단 테이블</title>
    <style>
        table {
            border-collapse: collapse;
            text-align: center;
        }
        th, td {
            border: 1px solid #ccc;
            padding: 8px 12px;
        }
        th {
            background-color: #f5f5f5;
        }
    </style>
</head>
<body>
    <table>
        <script>
            let x, y;
            
            document.write("<tr>");
            for (x = 2; x <= 9; x++) {
                document.write("<th>" + x + "단</th>");
            }
            document.write("</tr>");

            for (y = 1; y <= 9; y++) {
                document.write("<tr>");
                for (x = 2; x <= 9; x++) {
                    document.write("<td>" + x + " × " + y + " = " + (x * y) + "</td>");
                }
                document.write("</tr>");
            }
        </script>
    </table>
</body>
</html>
