<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    h1 {text-align: center;}
    .disp {width:205px; height:40px; margin-top:3px;}
    .disp{font-family:"Oxaninum", sans-serif; font-size: 22pt; text-align: right;}
    input[type=button]{width:50px; height:50px; text-align: center;
        vertical-align: middle; margin-top:5px;}
        #calc{width:220px; margin-left:auto; margin-right:auto;}
</style>
<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>
    $(document).ready(function(){
        $('.num').click(function(){
            let cur=$('#disp2').val();
            let n=$(this).val();
            $('#disp2').val(cur+n);
        });
        $('.op').click(function(){
            let cur=$('#disp2').val();
            let opt=$(this).val();
            
            if (opt==="="){
                $('#disp1').val(cur);
                if (cur.split('+').length==2){
                    let arr=cur.split('+');
                    $('#disp2').val(Number(arr[0])+Number(arr[1]));
                }
                if (cur.split('-').length==2){
                    let arr=cur.split('-');
                    $('#disp2').val(Number(arr[0])-Number(arr[1]));
                }
                if (cur.split('*').length==2){
                    let arr=cur.split('*');
                    $('#disp2').val(Number(arr[0])*Number(arr[1]));
                }
                if (cur.split('/').length==2){
                    let arr=cur.split('/');
                    $('#disp2').val(Number(arr[0])/Number(arr[1]));
                }
            }
            else{
                $('#disp2').val(cur+opt);
            }
        });
        $('.func').click(function(){
            $('#disp1').val("");
            $('#disp2').val("");
        });
    });
</script>
<body>
    <h1>계산기</h1>
    <div id="calc">
        <div>
            <input type="text" class="disp" id="disp1" readonly>
            <input type="text" class="disp" id="disp2" readonly>
        </div>
        <input type="button" class="num" value="7">
        <input type="button" class="num" value="8">
        <input type="button" class="num" value="9">
        <input type="button" class="op" value="+"><br>
        <input type="button" class="num" value="4">
        <input type="button" class="num" value="5">
        <input type="button" class="num" value="6">
        <input type="button" class="op" value="-"><br>
        <input type="button" class="num" value="1">
        <input type="button" class="num" value="2">
        <input type="button" class="num" value="3">
        <input type="button" class="op" value="*"><br>
        <input type="button" class="func" value="AC">
        <input type="button" class="num" value="0">
        <input type="button" class="op" value="=">
        <input type="button" class="op" value="/">
    </div>
</body>
</html>
