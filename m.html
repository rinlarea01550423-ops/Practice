<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        for (let y = 1; y <= 9; y++) {
            for (let x = 2; x <= 9; x++) {
                document.write(x + "x" + y + "=" + (x * y) + "&nbsp;&nbsp;&nbsp;&nbsp;");
            }
            document.write("<br>");
        }
    </script>
</body>
</html>
