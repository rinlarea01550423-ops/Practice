<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let x=2;
        let y=1;
        for (x=2; x<=9; x++){
            for (y=1; y<=9; y++){
                document.write(x+"x"+y+"="+(x*y)+"<br>");
            }
            document.write("<br>");
        }
    </script>
</body>
</html>
